name: Aktualizace a nasazení TV programu

on:
  # Automatické spuštění – 1× denně ve 5:00 UTC = 7:00 CEST
  schedule:
    - cron: '0 5 * * *'
  # Nasadí web i při jakékoliv manuální změně kódu v repozitáři
  push:
    branches:
      - main
  # Možnost ručního spuštění přes GitHub UI
  workflow_dispatch:

# Oprávnění potřebná pro uložení změn a nasazení na GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Zabrání tomu, aby běželo více nasazení najednou
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      # 1. Stažení kódu z repozitáře
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      # 2. Nastavení Pythonu pro skript
      - name: Nastavení Pythonu 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Spuštění EPG skriptu (stáhne nová data)
      - name: Stažení a zpracování EPG dat
        run: python scripts/fetch_epg.py --output public/epg_data.json --days 7

      # 4. Commit a push, pokud se JSON změnil
      - name: Uložení aktualizovaného JSON do repozitáře
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet public/epg_data.json; then
            echo "EPG data jsou beze změny, přeskakuji commit."
          else
            git add public/epg_data.json
            git commit -m "chore: aktualizace EPG dat [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
            echo "EPG data úspěšně aktualizována a odeslána."
          fi

      # 5. Příprava a nasazení na GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vystavíme obsah složky public
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
